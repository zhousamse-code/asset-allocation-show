<style>/* Layout concept: a full-bleed dark stage (WebGL) with one quiet text block per pause point;
   the 3D subject is framed opposite the text. Single deliberate dark look. */
:root {
  color-scheme: dark;
  --bg: #000000;
  --ink: #f5f5f7;
  --ink-2: #b7b7be;
  --ink-3: #7d7d86;
  --line: rgba(255, 255, 255, 0.14);
  --panel: rgba(18, 18, 22, 0.66);
  --spx: #2997ff;
  --spx-2: #8cc8ff;
  --gold: #f2c14e;
  --gold-2: #ffe6a6;
  --rmb: #ff6a5e;
  --usd: #4fe0a8;
  --teal: #5fd4cc;
  --silver: #e2e4e8;
  --risk: #ff5a4f;
  --ok: #40d77a;
  --violet: #b59cff;
  --amber: #ffb340;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI",
    "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", "Helvetica Neue", Arial, sans-serif;
  --num: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  --ease: cubic-bezier(0.2, 0.65, 0.2, 1);
}
html,
body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  overflow: hidden;
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overscroll-behavior: none;
}
body {
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

#stage {
  position: fixed;
  inset: 0;
  cursor: pointer;
}
#gl {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
#scrim {
  position: absolute;
  inset: 0;
  pointer-events: none;
  transition: opacity 1s var(--ease);
  opacity: 0;
}
#scrim.left {
  opacity: 1;
  background: linear-gradient(90deg, rgba(0, 0, 0, 0.66) 0%, rgba(0, 0, 0, 0.42) 34%, rgba(0, 0, 0, 0) 56%);
}
#scrim.top {
  opacity: 1;
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.66) 0%, rgba(0, 0, 0, 0.3) 24%, rgba(0, 0, 0, 0) 42%);
}
#scrim.center {
  opacity: 1;
  background: rgba(0, 0, 0, 0.5);
}
#labels {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}
#slides {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

/* ---------- slide text ---------- */
.slide {
  position: absolute;
  display: flex;
  flex-direction: column;
  gap: clamp(12px, 1.7vh, 22px);
}
.slide.left {
  left: max(5.5vw, 32px);
  top: 50%;
  transform: translateY(-50%);
  width: min(41vw, 680px);
}
.slide.left.cover {
  width: min(47vw, 820px);
}
.slide.top {
  left: 50%;
  top: max(10.5vh, 76px);
  transform: translateX(-50%);
  width: min(88vw, 1120px);
  text-align: center;
  align-items: center;
}
.slide.center {
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(92vw, 1120px);
  text-align: center;
  align-items: center;
}
.slide > * {
  opacity: 0;
  transform: translateY(26px);
  filter: blur(8px);
  transition: opacity 0.9s var(--ease), transform 1.1s var(--ease), filter 0.9s ease;
  transition-delay: calc(var(--i, 0) * 110ms + 240ms);
}
.slide.in > * {
  opacity: 1;
  transform: none;
  filter: blur(0);
}
.slide.out > * {
  opacity: 0;
  transform: translateY(-14px);
  filter: blur(6px);
  transition-duration: 0.45s, 0.5s, 0.45s;
  transition-delay: calc(var(--i, 0) * 25ms);
}
.qa .slide > * {
  transition: none !important;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: clamp(13px, 1vw, 16px);
  font-weight: 600;
  letter-spacing: 0.14em;
  color: var(--ink-3);
}
.eyebrow b {
  color: var(--gold);
  font-weight: 600;
}
.eyebrow b::after {
  content: "";
  display: inline-block;
  width: 22px;
  height: 1px;
  margin-left: 12px;
  vertical-align: middle;
  background: var(--ink-3);
}
.h {
  margin: 0;
  font-size: clamp(28px, 3.55vw, 62px);
  line-height: 1.16;
  font-weight: 700;
  letter-spacing: -0.005em;
  text-wrap: balance;
}
.cover .h {
  font-size: clamp(34px, 4.7vw, 84px);
  line-height: 1.1;
}
.top .h br,
.center .h br {
  display: none;
}
.h em {
  font-style: normal;
  background: linear-gradient(100deg, var(--gold-2), var(--gold) 65%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.h em.blue {
  background-image: linear-gradient(100deg, #cfe8ff, var(--spx) 75%);
}
.h em.red {
  background-image: linear-gradient(100deg, #ffc2bb, var(--risk) 70%);
}
.sub {
  margin: 0;
  font-size: clamp(17px, 1.45vw, 24px);
  line-height: 1.65;
  color: var(--ink-2);
  max-width: 34em;
  text-wrap: pretty;
}
.extra {
  max-width: 100%;
  min-width: 0;
}
.slide.center .extra {
  align-self: stretch;
}
.note {
  margin: 0;
  font-size: clamp(14px, 1.05vw, 17px);
  line-height: 1.6;
  color: var(--ink-3);
  max-width: 34em;
}
.legal {
  margin: 6px 0 0;
  font-size: 13px;
  line-height: 1.6;
  color: var(--ink-3);
  max-width: 46em;
}
.chain {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 10px;
  font-size: clamp(15px, 1.25vw, 20px);
}
.chain span {
  padding: 8px 14px;
  border-radius: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--ink);
  font-weight: 600;
}
.chain i {
  font-style: normal;
  color: var(--ink-3);
}
.slide.left .chain {
  justify-content: flex-start;
}
.causes {
  list-style: none;
  margin: 0 0 14px;
  padding: 0;
  display: grid;
  gap: 10px;
}
.causes li {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 14px;
  align-items: baseline;
  padding: 12px 16px;
  border-radius: 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  font-size: clamp(15px, 1.2vw, 19px);
  line-height: 1.55;
  color: var(--ink-2);
}
.causes b {
  color: var(--ink);
  font-weight: 700;
  white-space: nowrap;
}
.causes li:first-child b {
  color: #e0b07a;
}
.causes li:last-child b {
  color: var(--rmb);
}
.extra .note + .note {
  margin-top: 8px;
}
.extra .chain + .note {
  margin-top: 14px;
}
.risks {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
}
.risks li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 18px 10px 10px;
  border-radius: 999px;
  background: var(--panel);
  border: 1px solid var(--line);
  font-size: clamp(16px, 1.35vw, 22px);
  font-weight: 600;
}
.risks b {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(255, 90, 79, 0.16);
  color: var(--risk);
  font: 700 15px/1 var(--num);
}
.spec {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 14px 22px;
  margin: 4px 0 0;
  padding: 22px 26px;
  border-radius: 20px;
  background: var(--panel);
  border: 1px solid var(--line);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  font-size: clamp(15px, 1.2vw, 20px);
  line-height: 1.5;
}
.spec dt {
  color: var(--ink-3);
  white-space: nowrap;
}
.spec dd {
  margin: 0;
  color: var(--ink);
}
.tags {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}
.tag {
  display: inline-block;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
  background: rgba(41, 151, 255, 0.16);
  color: var(--spx-2);
}
.tag.silver {
  background: rgba(226, 228, 232, 0.12);
  color: var(--silver);
}
.tag.green {
  background: rgba(79, 224, 168, 0.14);
  color: var(--usd);
}
.cmpwrap {
  width: 100%;
  overflow-x: auto;
  pointer-events: auto;
  cursor: default;
  border-radius: 20px;
  background: var(--panel);
  border: 1px solid var(--line);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.cmp {
  width: 100%;
  min-width: 640px;
  border-collapse: collapse;
  font-size: clamp(14px, 1.15vw, 19px);
  line-height: 1.45;
  text-align: left;
}
.cmp th,
.cmp td {
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
.cmp tbody tr:last-child th,
.cmp tbody tr:last-child td {
  border-bottom: 0;
}
.cmp thead th {
  font-size: clamp(16px, 1.35vw, 22px);
  color: var(--ink);
}
.cmp thead th .tag {
  display: table;
  margin-bottom: 8px;
  font-size: 12px;
  padding: 4px 10px;
}
.cmp thead small {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-3);
  margin-top: 4px;
}
.cmp tbody th {
  color: var(--ink-3);
  font-weight: 500;
  white-space: nowrap;
}
.cmp td b {
  font: 700 1.1em/1.2 var(--num);
}
.cmp td:nth-child(2) {
  background: rgba(41, 151, 255, 0.06);
}
.cmp thead th:nth-child(2) {
  background: rgba(41, 151, 255, 0.1);
}

/* ---------- 3D-anchored labels ---------- */
.lbl {
  position: absolute;
  left: 0;
  top: 0;
  visibility: hidden;
  will-change: transform, opacity;
}
.lbl > div {
  position: absolute;
  left: 0;
  top: 0;
  transform: translate(-50%, -100%);
  padding-bottom: 8px;
  text-align: center;
  white-space: nowrap;
}
.lbl.down > div {
  transform: translate(-50%, 0);
  padding: 8px 0 0;
}
.lbl.mid > div {
  transform: translate(-50%, -50%);
  padding: 0;
}
.lbl.right > div {
  transform: translate(0, -50%);
  padding: 0 0 0 12px;
  text-align: left;
}
.lbl.left > div {
  transform: translate(-100%, -50%);
  padding: 0 12px 0 0;
  text-align: right;
}
.lbl .t {
  display: block;
  font-size: clamp(14px, 1.12vw, 19px);
  font-weight: 600;
  color: var(--ink);
  text-shadow: 0 1px 10px rgba(0, 0, 0, 0.9);
}
.lbl .v {
  display: block;
  font: 700 clamp(21px, 2vw, 34px) / 1.12 var(--num);
  color: var(--ink);
  text-shadow: 0 2px 16px rgba(0, 0, 0, 0.75);
  font-variant-numeric: tabular-nums;
}
.lbl .v.sm {
  font-size: clamp(17px, 1.5vw, 26px);
}
.lbl .c {
  display: block;
  margin-top: 2px;
  font-size: clamp(12px, 0.92vw, 15px);
  color: var(--ink-2);
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.95);
}
.lbl .pill {
  display: inline-block;
  padding: 7px 14px;
  border-radius: 999px;
  background: rgba(18, 18, 22, 0.72);
  border: 1px solid var(--line);
  font-size: clamp(13px, 1vw, 16px);
  color: var(--ink);
}
.lbl .pill.amber {
  border-color: rgba(255, 179, 64, 0.5);
  color: var(--amber);
}
.lbl .dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  margin: 0 6px 2px 0;
  border-radius: 50%;
  vertical-align: middle;
}
.dot.blue {
  background: var(--spx);
}
.dot.gold {
  background: var(--gold);
}
.lbl .blue {
  color: var(--spx-2);
}
.lbl .gold {
  color: var(--gold);
}
.lbl .red {
  color: var(--risk);
}
.lbl .green {
  color: var(--ok);
}
.lbl .teal {
  color: var(--teal);
}
.lbl .silver {
  color: var(--silver);
}
.lbl .violet {
  color: var(--violet);
}
.lbl .amber {
  color: var(--amber);
}
.lbl .muted {
  color: var(--ink-3);
}

/* ---------- chrome ---------- */
#top {
  position: fixed;
  z-index: 6;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) max(28px, env(safe-area-inset-right, 0px)) 0 max(28px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
#brand {
  font-size: 13px;
  letter-spacing: 0.08em;
  color: var(--ink-3);
  white-space: nowrap;
}
#brand b {
  color: var(--ink-2);
  font-weight: 600;
}
#acts {
  display: flex;
  gap: 2px;
  pointer-events: auto;
  padding: 4px;
  border-radius: 999px;
  background: rgba(28, 28, 32, 0.55);
  border: 1px solid var(--line);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
#acts button {
  all: unset;
  cursor: pointer;
  font-size: 13px;
  padding: 6px 12px;
  border-radius: 999px;
  color: var(--ink-3);
  transition: color 0.3s, background 0.3s;
  white-space: nowrap;
}
#acts button:hover {
  color: var(--ink);
}
#acts button.on {
  background: rgba(255, 255, 255, 0.12);
  color: var(--ink);
}
#acts button:focus-visible,
#ctrl button:focus-visible {
  outline: 2px solid var(--spx);
  outline-offset: 2px;
}
#bottom {
  position: fixed;
  z-index: 6;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 max(28px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(28px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
#prog {
  flex: 1;
  height: 2px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.12);
  overflow: hidden;
}
#prog i {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--spx), var(--gold));
  transition: width 0.8s var(--ease);
}
#ctrl {
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: auto;
}
#ctrl button {
  all: unset;
  cursor: pointer;
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(40, 40, 46, 0.6);
  border: 1px solid var(--line);
  color: var(--ink);
  font-size: 18px;
  line-height: 1;
  transition: background 0.3s, opacity 0.3s;
}
#ctrl button:hover {
  background: rgba(70, 70, 78, 0.7);
}
#ctrl button:disabled {
  opacity: 0.3;
  cursor: default;
}
#count {
  position: relative;
  min-width: 70px;
  text-align: center;
  font: 500 13px/1 var(--num);
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
#count::after {
  content: "";
  position: absolute;
  right: -2px;
  top: 50%;
  width: 6px;
  height: 6px;
  margin-top: -3px;
  border-radius: 50%;
  background: var(--ok);
  opacity: 0;
  transition: opacity 0.6s;
}
.settled #count::after {
  opacity: 1;
  animation: pulse 2.2s ease-in-out infinite;
}
#hint {
  position: fixed;
  z-index: 6;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 70px);
  transform: translateX(-50%);
  padding: 9px 18px;
  border-radius: 999px;
  background: rgba(28, 28, 32, 0.6);
  border: 1px solid var(--line);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  font-size: 14px;
  color: var(--ink-2);
  white-space: nowrap;
  pointer-events: none;
  transition: opacity 0.6s;
  animation: float 2.6s ease-in-out infinite;
}
#hint.gone {
  opacity: 0;
}
#loading {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  background: var(--bg);
  color: var(--ink-3);
  font-size: 14px;
  letter-spacing: 0.1em;
  transition: opacity 1.2s var(--ease), visibility 1.2s;
}
#loading.gone {
  opacity: 0;
  visibility: hidden;
}
#nogl {
  display: none;
}
.nogl #nogl {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: center;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  background: var(--bg);
  color: var(--ink-2);
  text-align: center;
  font-size: 18px;
  line-height: 1.7;
}
@keyframes pulse {
  0%,
  100% {
    transform: scale(1);
    opacity: 1;
  }
  50% {
    transform: scale(1.6);
    opacity: 0.5;
  }
}
@keyframes float {
  0%,
  100% {
    transform: translate(-50%, 0);
  }
  50% {
    transform: translate(-50%, -5px);
  }
}

/* ---------- narrow screens: text on top, scene below ---------- */
@media (max-width: 760px), (max-aspect-ratio: 1/1) {
  #brand {
    display: none;
  }
  #top {
    justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #acts {
    max-width: 100%;
    overflow-x: auto;
    scrollbar-width: none;
  }
  #acts button {
    padding: 6px 9px;
    font-size: 12px;
  }
  #bottom {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .slide.top,
  .slide.center {
    width: calc(100vw - 32px);
    top: 74px;
  }
  .slide.center {
    top: 50%;
  }
  .h {
    font-size: clamp(24px, 7vw, 40px);
  }
  .cover .h {
    font-size: clamp(30px, 8.5vw, 48px);
  }
  .sub {
    font-size: 16px;
  }
  .h br {
    display: none;
  }
  .spec {
    padding: 16px 18px;
    gap: 8px 14px;
    font-size: 14px;
  }
  .lbl .c {
    display: none;
  }
  #hint {
    font-size: 13px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .slide > * {
    filter: none !important;
    transform: none !important;
    transition-duration: 0.3s !important;
  }
  #hint,
  .settled #count::after {
    animation: none;
  }
}
</style>

<body>
<div id="stage">
  <canvas id="gl" aria-label="三维动画演示"></canvas>
  <div id="scrim"></div>
  <div id="labels" aria-hidden="true"></div>
  <main id="slides" aria-live="polite"></main>
</div>
<header id="top">
  <div id="brand"><b>200 万闲钱</b> · 全球资产配置</div>

</header>
