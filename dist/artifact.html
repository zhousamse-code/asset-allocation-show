function bundleSet(piece, n, { w = BW, h = BH, d = BD } = {}) {
  const mat = piece.m(new THREE6.MeshStandardMaterial({ color: 16777215, map: noteTex(), roughness: 0.5, metalness: 0.05 }));
  const mesh = new THREE6.InstancedMesh(rbox(w, h, d, 0.035, 2), mat, n);
  mesh.instanceMatrix.setUsage(THREE6.DynamicDrawUsage);
  mesh.instanceColor = new THREE6.InstancedBufferAttribute(new Float32Array(n * 3), 3);
  mesh.instanceColor.setUsage(THREE6.DynamicDrawUsage);
  mesh.frustumCulled = false;
  const band = new THREE6.InstancedMesh(
    new THREE6.BoxGeometry(w * 0.19, h + 0.014, d + 0.016),
    piece.m(new THREE6.MeshStandardMaterial({ color: 13483935, roughness: 0.78 })),
    n
  );
  band.instanceMatrix.setUsage(THREE6.DynamicDrawUsage);
  band.frustumCulled = false;
  const M3 = new THREE6.Matrix4();
  const Q = new THREE6.Quaternion();
  const E2 = new THREE6.Euler();
  const P = new THREE6.Vector3();
  const S = new THREE6.Vector3();
  const Z = new THREE6.Matrix4().makeScale(0, 0, 0);
  for (let i = 0; i < n; i++) {
    mesh.setMatrixAt(i, Z);
    band.setMatrixAt(i, Z);
  }
  return {
    mesh,
    band,
    h,
    set(i, x, y, z, s = 1, color = null, rotY = 0, rotZ = 0) {
      if (s <= 1e-3) {
        mesh.setMatrixAt(i, Z);
        band.setMatrixAt(i, Z);
        return;
      }
      E2.set(0, rotY, rotZ);
      Q.setFromEuler(E2);
      M3.compose(P.set(x, y, z), Q, S.setScalar(s));
      mesh.setMatrixAt(i, M3);
      band.setMatrixAt(i, M3);
      if (color) mesh.setColorAt(i, color);
    },
    hide(i) {
      mesh.setMatrixAt(i, Z);
      band.setMatrixAt(i, Z);
    },
    commit() {
      mesh.instanceMatrix.needsUpdate = true;
      band.instanceMatrix.needsUpdate = true;
      mesh.instanceColor.needsUpdate = true;
    }
  };
}
function glowTower(piece, color, { w = 1.3, d = 1.3, em = 0.35 } = {}) {
  const g = new THREE6.Group();

    this.lWork.target = this.lBank.target = this.lFac.target = this.lBuy.target = on(t > 0.4);

    this.lTR.target = this.lTU.target = on(!up && t > 1.2);
    this.lHoard.target = on(!up && t > 2.6);
    this.lToUsd.target = on(wide && !up && t > 3.8);
  }

    const how = p.mode === "year" ? `每年年初投 ${wan(r.per)}，投了 ${r.nPay} 年` : `${p.year} 年年初一次投入 ${wan(r.total)}`;
    this.o.k1.textContent = `到今天（${SPX_ASOF[0]} 年 ${SPX_ASOF[1]} 月）`;
    this.o.v1.textContent = `≈ ${wan(r.now)}`;
    this.o.d1.textContent = `${how}。${gain >= 0 ? "赚了" : "亏了"} ${wan(Math.abs(gain))}，平均每年 ${r.rate >= 0 ? "+" : "−"}${Math.abs(r.rate * 100).toFixed(1)}%。`;
    const w = r.worst;
    const [wy, wm] = r.when;
    this.o.v2.textContent = `${wy} 年 ${wm} 月`;
    const left = w.v < w.inv ? p.mode === "year" ? `已经投进去 ${wan(w.inv)}，账户只剩 ${wan(w.v)}` : `${wan(w.inv)} 只剩 ${wan(w.v)}` : `账户从 ${wan(w.hw)} 跌到 ${wan(w.v)}`;
    const back = r.recMonths < 0 ? "到今天还没涨回来" : `之后 ${span(r.recMonths)}涨回原来的高点`;
    this.o.d2.textContent = `比之前的最高点跌了 ${Math.round(w.dd * 100)}%：${left}。${back}。`;
    const n = r.n;
    let vmax = r.total;
    for (let j = 0; j <= n; j++) if (r.val[j] > vmax) vmax = r.val[j];
    const raw = vmax / 4.5;
    const pow = 10 ** Math.floor(Math.log10(raw));
    const step = [1, 2, 5, 10].map((k) => k * pow).find((k) => k >= raw);
    const ymax = Math.max(vmax * 1.04, step * Math.ceil(vmax * 0.98 / step));
    const sy = (v) => v / ymax * CH;
    const kw = Math.round(w.j / n * M);
    for (let k = 0; k <= M; k++) {
      const x = k / M * n;
      const j0 = Math.floor(x);
      const j1 = Math.min(n, j0 + 1);
      const u = x - j0;
      this.tgt[k] = sy(r.val[j0] * (1 - u) + r.val[j1] * u);
      this.tgtI[k] = sy(r.inv[Math.min(n, Math.round(x))]);
    }
    if (w.dd > 0) this.tgt[kw] = sy(w.v);
    this.kw = kw;
    Object.assign(this.mkT, { wx: kw / M * CW, wy: sy(w.v), hy: sy(w.hw), ey: sy(r.now), iy: sy(r.total) });
    this.grid.forEach((g, i) => {
      const v = step * (i + 1);
      g.on = v <= ymax * 1.001;
      g.yT = sy(v);
      g.lab.set(`<span class="c">${v >= 1e4 ? `${+(v / 1e4).toFixed(2)} 亿` : `${sep(v)} 万`}</span>`);
    });
    const yrs = n / 12;
    const ts = yrs <= 7 ? 1 : yrs <= 16 ? 2 : yrs <= 36 ? 5 : yrs <= 70 ? 10 : 20;
    let ty = Math.ceil(p.year / ts) * ts;
    if (ty - p.year < ts * 0.7) ty += ts;
    const list = [p.year];
    for (; ty <= SPX_ASOF[0] && list.length < this.ticks.length; ty += ts) list.push(ty);
    this.ticks.forEach((l, i) => {
      l.use = i < list.length;
      if (!l.use) return;
      const j = (list[i] - p.year) * 12;
      l.pos.x = X0 + j / n * CW;
      l.set(`<span class="c">${list[i]}${i === 0 ? " 年初" : ""}</span>`);
    });
    this.lEnd.set(`<span class="v sm blue">≈ ${wan(r.now)}</span><span class="c">今天</span>`);
    this.lInv.set(`<span class="t muted">本金 ${wan(r.total)}</span>`);
    this.lWorst.set(`<span class="t red">最难熬：${wy} 年 ${wm} 月</span><span class="c">比最高点跌了 ${Math.round(w.dd * 100)}%</span>`);
    this.dirty = true;
  }
  enter(st, prev, fresh) {
    if (fresh) {
      this.cur.fill(0);
      this.curI.fill(0);
      Object.assign(this.mk, this.mkT, { wy: 0, hy: 0, ey: 0, iy: 0 });
      for (const g of this.grid) g.y = 0;
      this.rebuild();
      this.dirty = true;
    }
  }
  update(dt) {
    const t = this.t;
    if (this.visT === 1) {
      const slot = document.querySelector("#slides .slide:last-child .calc-slot");
      if (slot && this.panel.parentNode !== slot) slot.appendChild(this.panel);
    }
    const go = t > 0.5;
    if (go && this.dirty) {
      let moving = false;
      const k = 1 - Math.exp(-7 * dt);
      for (let i = 0; i <= M; i++) {
        const d = this.tgt[i] - this.cur[i];
        const e = this.tgtI[i] - this.curI[i];
        if (Math.abs(d) > 2e-3 || Math.abs(e) > 2e-3) moving = true;
        this.cur[i] += d * k;
        this.curI[i] += e * k;
      }
      for (const key in this.mk) this.mk[key] += (this.mkT[key] - this.mk[key]) * k;
      for (const g of this.grid) g.y += (g.yT - g.y) * k;
      if (!moving) {
        this.cur.set(this.tgt);
        this.curI.set(this.tgtI);
        Object.assign(this.mk, this.mkT);
        for (const g of this.grid) g.y = g.yT;
        this.dirty = false;
      }
      this.rebuild();
    }
    const mk = this.mk;
    const wx = X0 + mk.wx;
    this.dotW.position.set(wx, Y02 + mk.wy, 0.08);
    const dh = Math.max(1e-3, mk.hy - mk.wy);
    this.drop.position.set(wx, Y02 + mk.wy + dh / 2, 0.06);
    this.drop.scale.y = dh;
    this.dotE.position.set(X0 + CW, Y02 + mk.ey, 0.08);
    const shown = go && t > 1;
    this.dotW.visible = this.drop.visible = this.dotE.visible = shown;
    for (const g of this.grid) {
      g.g.position.y = Y02 + g.y;
      g.g.visible = g.on && go;
      g.lab.pos.y = Y02 + g.y;
      g.lab.target = g.on && shown ? 1 : 0;
    }
    for (const l of this.ticks) l.target = l.use && go ? 1 : 0;
    const nar = this.app.ui.narrow();
    this.lEnd.pos.y = Y02 + mk.ey;
    let iy = mk.iy;
    if (Math.abs(iy - mk.ey) < 0.75) iy = mk.ey - 0.75;
    this.lInv.pos.y = Y02 + Math.max(0.25, iy);
    this.lEnd.target = shown ? 1 : 0;
    this.lInv.target = shown && !nar ? 1 : 0;
    const late = mk.wx > CW * 0.72;
    this.lWorst.el.className = late ? "lbl left" : "lbl up";
    if (late) this.lWorst.pos.set(wx - 0.3, Y02 + mk.wy, 0.1);
    else this.lWorst.pos.set(Math.max(X0 + 1.6, wx), Y02 + mk.hy + 0.15, 0.1);
    this.lWorst.target = shown && this.r.worst.dd > 5e-3 ? 1 : 0;
  }
  rebuild() {
    const lp = this.lineGeo.attributes.position.array;
    const ap = this.areaGeo.attributes.position.array;
    const ip = this.invGeo.attributes.position.array;
    const dx = CW / M;
    const c = this.cur;
    for (let k = 0; k <= M; k++) {
      const x = X0 + k * dx;
      const y = Y02 + c[k];
      const ya = c[Math.max(0, k - 1)];
      const yb = c[Math.min(M, k + 1)];
      let tx = k === 0 || k === M ? dx : 2 * dx;
      let ty = yb - ya;
      const len = Math.hypot(tx, ty);
      tx /= len;
      ty /= len;
      const nx = -ty * LW / 2;
      const ny = tx * LW / 2;
      const o = k * 6;
      lp[o] = x + nx;
      lp[o + 1] = y + ny;
      lp[o + 2] = 0;
      lp[o + 3] = x - nx;
      lp[o + 4] = y - ny;
      lp[o + 5] = 0;
      ap[o] = x;
      ap[o + 1] = Y02;
      ap[o + 2] = 0;
      ap[o + 3] = x;
      ap[o + 4] = y;
      ap[o + 5] = 0;
      ip[k * 3] = x;
      ip[k * 3 + 1] = Y02 + this.curI[k];
      ip[k * 3 + 2] = 0;
    }
    this.lineGeo.attributes.position.needsUpdate = true;
    this.areaGeo.attributes.position.needsUpdate = true;
    const ld = this.invGeo.attributes.lineDistance.array;
    ld[0] = 0;
    for (let k = 1; k <= M; k++) ld[k] = ld[k - 1] + Math.hypot(dx, this.curI[k] - this.curI[k - 1]);
    this.invGeo.attributes.position.needsUpdate = true;
    this.invGeo.attributes.lineDistance.needsUpdate = true;
  }
};

import * as THREE21 from "three";
var PAD2 = 0.24;
var XH = -8.5;
var XB = -2.2;
var XF = 4.6;
var XS = 10.6;
var ZS = 2;
var N2 = 10;
var RMB2 = new THREE21.Color(14239803);
var slots = (x) => Array.from({ length: N2 }, (_, k) => new THREE21.Vector3(x + (k % 2 - 0.5) * 0.96, PAD2 + 0.09 + Math.floor(k / 2) * 0.165, ZS));
var SH = slots(XH);
var SB = slots(XB);
var SF = slots(XF);
var SS = slots(XS);
var arc3 = (a, b, u, h, out) => out.set(a.x + (b.x - a.x) * u, a.y + (b.y - a.y) * u + 4 * h * u * (1 - u), a.z + (b.z - a.z) * u);
var fly = (t, t0, dur, i) => eInOut(seg(t, t0 + i * 0.07, t0 + dur + i * 0.07));
var Lend = class extends Piece {
  constructor(app2, name, origin) {

    const padMat = this.m(new THREE21.MeshStandardMaterial({ color: 1710880, metalness: 0.6, roughness: 0.4 }));
    const pad = (x, rim, parent) => {
      const m = new THREE21.Mesh(rbox(4.6, PAD2, 5, 0.08), padMat);
      m.position.set(x, PAD2 / 2, 0.7);
      const r = new THREE21.Mesh(rbox(4.66, 0.06, 5.06, 0.03), this.m(new THREE21.MeshBasicMaterial({ color: hdr(rim, 1.3) })));
      r.position.set(x, 0.06, 0.7);
      parent.add(m, r);
    };
    const put = (obj, x, s, parent = this.inner) => {
      obj.position.set(x, PAD2, -0.4);
      obj.scale.setScalar(s);
      parent.add(obj);
    };
    pad(XH, 15909198, this.inner);
    pad(XB, 10133674, this.inner);
    pad(XF, 15222844, this.inner);
    put(house(this, stone, roof, win), XH, 1.4);
    put(bankModel(this, stone), XB, 1.15);
    put(factory(this, stone, win), XF, 0.95);
    this.shop = new THREE21.Group();
    this.shop.position.set(XS, 0, 0);
    this.add(this.shop);
    pad(0, 15909198, this.shop);
    put(house(this, stone, roof2, win), 0, 1.4, this.shop);
    const book = (x) => {
      const g = new THREE21.Group();
      const card = new THREE21.Mesh(rbox(1.5, 0.95, 0.08, 0.03), this.m(new THREE21.MeshStandardMaterial({ color: 9379106, emissive: 3803660, roughness: 0.5 })));

      txt.position.z = 0.045;
      g.add(txt);
      g.position.set(x, PAD2 + 0.52, ZS);
      g.rotation.x = -0.22;
      this.add(g);
      return g;
    };
    this.book1 = book(XH);
    this.book2 = book(XS);
    this.bills = bundleSet(this, N2, { w: 0.86, h: 0.15, d: 0.42 });
    this.add(this.bills.mesh, this.bills.band);
    this.P = new THREE21.Vector3();
    this.add(blob(this, 30, 10, 0.6));
    this.lHouse = this.label('<span class="t">存钱的人</span>', [XH, 3.15, -0.4]);
    this.lBank = this.label('<span class="t">银行</span>', [XB, 3.6, -0.4]);
    this.lFac = this.label('<span class="t">借钱的人</span>', [XF, 3.2, -0.4]);
    this.lShop = this.label('<span class="t">收到货款的人</span>', [XS, 3.15, -0.4]);
    this.lBook1 = this.label("", [XH, 0.1, ZS + 0.75], "down");
    this.lBook2 = this.label('<span class="v sm gold">存折 90 万</span><span class="c">货款存进了银行</span>', [XS, 0.1, ZS + 0.75], "down");
    this.lKeep = this.label("", [XB, 0.1, ZS + 0.75], "down");
    this.lGot = this.label("", [XF, 0.1, ZS + 0.75], "down");
    this.pill = [
      this.label('<span class="pill">① 存进 100 万 →</span>', [(XH + XB) / 2, 4.3, 1]),
      this.label('<span class="pill">② 借出 90 万 →</span>', [(XB + XF) / 2, 4.3, 1]),
      this.label('<span class="pill">③ 花出去：付货款 90 万 →</span>', [(XF + XS) / 2, 4.3, 1]),
      this.label('<span class="pill">← ④ 又存进银行</span>', [(XS + XB) / 2, 6.3, 1.4]),
      this.label('<span class="pill">⑤ 再借出 80 万 →</span>', [(XB + XF) / 2, 4.3, 1])
    ];

  }
  enter(st, prev, fresh) {
    if (fresh) {
      this.kShop = st.step === "loop" ? 1 : 0;
      this.cx = st.step === "loop" ? 1.05 : -1.95;
    }
  }
  /* where bundle i is at time t of a step */
  place(i, loop, t, out) {
    if (!loop) {
      if (i > 0) {
        const u22 = fly(t, 3.2, 0.9, i);
        if (u22 > 0) return arc3(SB[i], SF[i - 1], u22, 2.2, out);
      }
      return arc3(SH[i], SB[i], fly(t, 0.9, 0.9, i), 2.2, out);
    }
    if (i === 0) return out.copy(SB[0]);
    if (i > 1) {
      const u3 = fly(t, 5.3, 0.9, i);
      if (u3 > 0) return arc3(SB[i], SF[i - 2], u3, 2.2, out);
    }
    const u2 = fly(t, 2.9, 1.2, i);
    if (u2 > 0) return arc3(SS[i - 1], SB[i], u2, 4.4, out);
    return arc3(SF[i - 1], SS[i - 1], fly(t, 0.7, 0.9, i), 2, out);
  }
  update(dt) {
    const t = this.t;
    const loop = this.st.step === "loop";
    const on = (c) => c ? 1 : 0;
    const nar = this.app.ui.narrow();
    for (let i = 0; i < N2; i++) {
      this.place(i, loop, t, this.P);
      this.bills.set(i, this.P.x, this.P.y, this.P.z, 1, RMB2, 0);
    }
    this.bills.commit();
    this.kShop = damp(this.kShop, loop ? 1 : 0, 4, dt);
    this.shop.visible = this.kShop > 0.01;
    this.shop.scale.setScalar(Math.max(1e-3, this.kShop));
    const b1 = loop ? 1 : eOutBack(seg(t, 2.3, 2.8));
    const b2 = loop ? eOutBack(seg(t, 4.5, 5)) : 0;
    this.book1.visible = b1 > 0.01;
    this.book1.scale.setScalar(Math.max(1e-3, b1));
    this.book2.visible = b2 > 0.01;
    this.book2.scale.setScalar(Math.max(1e-3, b2));
    const lent = loop || t > 4.8;
    const pre = nar ? ["", ""] : ["存折 ", "现金 "];
    this.lBook1.set(`<span class="v sm gold">${pre[0]}100 万</span>${lent ? '<span class="c">一分没少，随时能花</span>' : ""}`);
    this.lBook1.target = on(b1 > 0.9);
    this.lBook2.set(`<span class="v sm gold">${pre[0]}90 万</span><span class="c">货款存进了银行</span>`);
    this.lShop.set(nar ? '<span class="t">收款的人</span>' : '<span class="t">收到货款的人</span>');
    this.lBook2.target = on(b2 > 0.9);
    this.lHouse.target = this.lBank.target = this.lFac.target = on(t > 0.3 || loop);
    this.lShop.target = on(loop && this.kShop > 0.8);
    this.lKeep.set(loop && t > 6.9 ? '<span class="c">每次留 10 万备用</span>' : '<span class="c">留 10 万备用</span>');
    this.lKeep.target = on(lent);
    this.lGot.set(loop && t > 2 ? `<span class="v sm">${pre[1]}80 万</span><span class="c">又借到一笔</span>` : `<span class="v sm">${pre[1]}90 万</span><span class="c">借来的，拿去用</span>`);
    this.lGot.target = on(loop ? t < 0.7 || t > 6.9 : t > 4.8);
    this.pill[0].target = on(!loop && t > 0.9 && !nar);
    this.pill[1].target = on(!loop && t > 3.2 && !nar);
    this.pill[2].target = on(loop && t > 0.7 && !nar);
    this.pill[3].target = on(loop && t > 2.9 && !nar);
    this.pill[4].target = on(loop && t > 5.3 && !nar);
    this.cx = damp(this.cx, loop ? 1.05 : -1.95, 3, dt);
    this.lSum.pos.x = this.cx;
    this.lSum.pos.z = 5.6 + (this.cx + 1.95) / 3 * 0.8 + (nar ? 2.2 : 0);
    const arrow = ' <span class="muted">→</span> ';
    let sum = "100 万";
    if (lent) sum += arrow + (loop && t > 7.2 ? "190 万" : '<span class="green">190 万</span>');
    if (loop && t > 7.2) sum += arrow + '<span class="green">270 万</span>' + arrow + "…";
    const note = loop && t > 7.2 ? "每转一圈，就多出一笔" : lent ? "存折上的 100 万还在，又多出借走的 90 万" : "";
    this.lSum.set(`<span class="c">市面上的钱</span><span class="v">${sum}</span>${note ? `<span class="c">${note}</span>` : ""}`);
    this.lSum.target = on(t > 0.5 || loop);
  }
};

// src/ui.js
var UI = class {
  constructor(app2, beats, acts) {
    this.app = app2;
    this.beats = beats;
    this.slides = document.getElementById("slides");
    this.count = document.getElementById("count");
    this.bar = document.querySelector("#prog i");
    this.hint = document.getElementById("hint");
    this.scrim = document.getElementById("scrim");
    this.cur = null;
    this.actFirst = acts.map((_, a) => beats.findIndex((b) => b.act === a));
    const nav = document.getElementById("acts");
    nav.innerHTML = acts.map((name, a) => `<button type="button" data-act="${a}" aria-label="跳到：${name}">${name}</button>`).join("");
    this.actBtns = [...nav.querySelectorAll("button")];
    this.actBtns.forEach(
      (b, a) => b.addEventListener("click", (e) => {
        e.stopPropagation();
        b.blur();
        app2.go(this.actFirst[a]);
      })
    );
    document.getElementById("prev").addEventListener("click", (e) => {
      e.stopPropagation();
      e.currentTarget.blur();
      app2.go(app2.beat - 1);
    });
    document.getElementById("next").addEventListener("click", (e) => {
      e.stopPropagation();
      e.currentTarget.blur();
      app2.go(app2.beat + 1);
    });
    document.getElementById("fs").addEventListener("click", (e) => {
      e.stopPropagation();
      app2.toggleFullscreen();
    });
  }
  narrow() {
    return window.innerWidth / window.innerHeight < 1.05 || window.innerWidth < 760;
  }
  show(b, i) {
    const el = document.createElement("section");
    let layout = b.layout || "left";
    if (this.narrow() && !layout.includes("table")) layout = layout.replace("left", "top");
    el.className = "slide " + layout;
    const parts = [];
    let k = 0;
    if (b.eyebrow) parts.push(`<div class="eyebrow" style="--i:${k++}">${b.eyebrow}</div>`);
    if (b.h) parts.push(`<h${i === 0 ? 1 : 2} class="h" style="--i:${k++}">${b.h}</h${i === 0 ? 1 : 2}>`);
    if (b.sub) parts.push(`<p class="sub" style="--i:${k++}">${b.sub}</p>`);
    if (b.extra) parts.push(`<div class="extra" style="--i:${k++}">${b.extra}</div>`);
    el.innerHTML = parts.join("");
    this.slides.appendChild(el);
    const old = this.cur;
    this.cur = el;
    if (old) {
      old.classList.remove("in");
      old.classList.add("out");
      setTimeout(() => old.remove(), 700);
    }
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("in")));
    if (document.documentElement.classList.contains("qa")) el.classList.add("in");
    this.scrim.className = layout.includes("left") ? "left" : layout.includes("top") ? "top" : "center";
    const n = this.beats.length;
    this.count.textContent = `${String(i + 1).padStart(2, "0")} / ${n}`;
    this.bar.style.width = `${i / (n - 1) * 100}%`;
    this.actBtns.forEach((btn, a) => {
      btn.classList.toggle("on", a === b.act);
      if (a === b.act) btn.setAttribute("aria-current", "step");
      else btn.removeAttribute("aria-current");
    });
    if (i > 0) this.hint.classList.add("gone");
    document.getElementById("prev").disabled = i === 0;
    document.getElementById("next").disabled = i === n - 1;
  }
};

// src/main.js
var QA = /[?&]qa\b/.test(location.search);
if (QA) document.documentElement.classList.add("qa");
var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var app = {
  time: 0,
  beat: -1,
  beatTime: 0,
  shake: 0,
  W: 1,
  H: 1,
  px: 1,
  mouse: { x: 0, y: 0, tx: 0, ty: 0 }

function boot() {
  const canvas = document.getElementById("gl");

  renderer.toneMappingExposure = 1;

  scene.fog = new THREE22.FogExp2(0, FOG);

  scene.environmentIntensity = 0.42;

  const key = new THREE22.DirectionalLight(16773342, 2.5);
  key.position.set(-0.55, 1, 0.75);
  scene.add(key);
  const rim = new THREE22.DirectionalLight(9418495, 1.9);
  rim.position.set(0.8, 0.55, -1);
  scene.add(rim);

  app.camera = camera;
  app.labels = new Labels(document.getElementById("labels"));
  app.floor = makeFloor(scene);
  app.dust = makeDust(scene);
  const { list, map } = buildPieces(app);
  app.pieces = map;
  app.list = list;
  const rt = new THREE22.WebGLRenderTarget(4, 4, { type: THREE22.HalfFloatType, samples: 4 });

    new ShaderPass({
      uniforms: { tDiffuse: { value: null } },
      vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
      fragmentShader: "uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ vec4 c = texture2D(tDiffuse, vUv); bvec4 bad = bvec4(isnan(c.r) || isinf(c.r), isnan(c.g) || isinf(c.g), isnan(c.b) || isinf(c.b), isnan(c.a) || isinf(c.a)); if (any(bad)) c = vec4(0.0, 0.0, 0.0, 1.0); gl_FragColor = clamp(c, vec4(0.0), vec4(48.0)); }"
    })

  composer.addPass(bloom);
  composer.addPass(new OutputPass());
  app.composer = composer;
  app.bloom = bloom;
  const ui = new UI(app, BEATS, ACTS);
  app.ui = ui;
  const quality = { budget: 23e5, scale: 1, msaa: 4, level: 0 };
  app.quality = quality;
  const ratio = () => {
    if (QA) return quality.qaRatio || 1;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const fit = Math.sqrt(quality.budget / Math.max(1, window.innerWidth * window.innerHeight));

    app.W = window.innerWidth;
    app.H = window.innerHeight;
    app.px = ratio();
    renderer.setPixelRatio(app.px);
    renderer.setSize(app.W, app.H, false);
    composer.setPixelRatio(app.px);
    composer.setSize(app.W, app.H);
    camera.aspect = app.W / app.H;

  };
  const setMsaa = (n) => {

    composer.renderTarget1.samples = n;
    composer.renderTarget2.samples = n;
    composer.renderTarget1.dispose();
    composer.renderTarget2.dispose();
  };
  const lower = () => {
    if (quality.scale > 0.6) quality.scale *= 0.8;
    else if (quality.msaa > 0) setMsaa(0);
    else if (bloom.enabled) bloom.enabled = false;

  };
  window.addEventListener("resize", resize);
  const cs = {
    pos: new THREE22.Vector3(-30, 14, 40),
    tgt: new THREE22.Vector3(0, 1, 0),
    fov: 34,
    fovT: 34,
    sx: 0,
    sy: 0,
    sxT: 0,
    syT: 0,
    tw: null
  };
  const UP = new THREE22.Vector3(0, 1, 0);
  const fwd = new THREE22.Vector3();
  const right = new THREE22.Vector3();
  const up2 = new THREE22.Vector3();
  function camGoal(b) {
    const c = b.cam;
    const o = map[c.at] ? map[c.at].origin : new THREE22.Vector3();
    const P = new THREE22.Vector3(...c.p).add(o);
    const T = new THREE22.Vector3(...c.t).add(o);
    const asp = app.W / app.H;
    const narrow = ui.narrow();
    let k = 1;
    if (asp < 1.6) k = clamp((1.6 / asp) ** 1.3, 1, 2.8);
    if (k !== 1) P.sub(T).multiplyScalar(k).add(T);
    return { P, T, fov: c.fov || 34, sx: narrow ? 0 : c.shift ? c.shift[0] : 0, sy: narrow ? c.nsy ?? 0.16 : c.shift ? c.shift[1] : 0 };
  }
  function camTo(b, instant, keepTween) {
    const g = camGoal(b);
    cs.fovT = g.fov;
    cs.sxT = g.sx;
    cs.syT = g.sy;
    if (instant) {
      cs.pos.copy(g.P);
      cs.tgt.copy(g.T);
      cs.tw = null;
      cs.fov = g.fov;
      cs.sx = g.sx;
      cs.sy = g.sy;
      return;
    }
    if (keepTween && cs.tw) {
      cs.tw.p1 = g.P;
      cs.tw.t1 = g.T;
      return;
    }
    const d = cs.pos.distanceTo(g.P) + 0.5 * cs.tgt.distanceTo(g.T);
    const dur = clamp(1.25 + d / 150, 1.35, 2.7);
    cs.tw = { p0: cs.pos.clone(), t0: cs.tgt.clone(), p1: g.P, t1: g.T, dur, k: 0, arc: Math.min(d * 0.085, 13) };

  function updateCam(dt) {
    const tw = cs.tw;
    if (tw) {
      tw.k += dt / tw.dur;
      const k = Math.min(1, tw.k);
      const e = eInOut(k);
      cs.pos.lerpVectors(tw.p0, tw.p1, e);
      cs.pos.y += Math.sin(Math.PI * e) * tw.arc;
      cs.tgt.lerpVectors(tw.t0, tw.t1, eInOut(Math.min(1, k * 1.07)));
      if (k >= 1) cs.tw = null;
    }
    cs.fov = damp(cs.fov, cs.fovT, 2.5, dt);
    cs.sx = damp(cs.sx, cs.sxT, 2.5, dt);
    cs.sy = damp(cs.sy, cs.syT, 2.5, dt);
    const m2 = app.mouse;
    m2.x = damp(m2.x, m2.tx, 2.5, dt);
    m2.y = damp(m2.y, m2.ty, 2.5, dt);
    fwd.subVectors(cs.tgt, cs.pos);
    const dist = fwd.length();
    fwd.normalize();
    right.crossVectors(fwd, UP).normalize();
    up2.crossVectors(right, fwd);
    const amp = dist * (REDUCED ? 4e-3 : 0.016);
    const t = app.time;
    const dx = Math.sin(t * 0.21) * amp + m2.x * dist * 0.03;
    const dy = Math.sin(t * 0.17 + 1.3) * amp * 0.6 + m2.y * dist * 0.018;
    camera.position.copy(cs.pos).addScaledVector(right, dx).addScaledVector(up2, dy);
    if (app.shake > 2e-3 && !REDUCED) {
      const s = app.shake * 0.28;
      camera.position.x += (Math.random() - 0.5) * s;
      camera.position.y += (Math.random() - 0.5) * s;
      app.shake = damp(app.shake, 0, 4.5, dt);
    }
    camera.lookAt(cs.tgt);
    camera.fov = cs.fov;
    camera.setViewOffset(app.W, app.H, -cs.sx * app.W, -cs.sy * app.H, app.W, app.H);
  }
  app.settled = () => !cs.tw;
  app.go = (i, instant = false) => {
    i = clamp(i, 0, BEATS.length - 1);
    if (i === app.beat && !instant) return;
    app.beat = i;
    app.beatTime = 0;
    const b = BEATS[i];
    for (const p of list) p.setState(b.pieces[p.name] || null);
    camTo(b, instant);
    ui.show(b, i);
    try {
      history.replaceState(null, "", "#b" + (i + 1));
    } catch (e) {
    }
  };
  app.toggleFullscreen = () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {
      });
    } catch (e) {
    }
  };
  const focus = new THREE22.Vector3();
  const lastCam = new THREE22.Vector3();

    app.beatTime += dt;
    updateCam(dt);
    for (const p of list) p.tick(dt, app.time);
    const spots = [];
    for (const p of list) {
      if (p.vis <= 0.01) continue;
      spots.push([p.origin.x + p.spot[0], p.origin.z + p.spot[1], p.spot[2], p.spot[3] * p.fade.value]);
    }

    lastCam.copy(camera.position);

    app.labels.update(dt, camera, app.W, app.H);

  }
  function render() {
    composer.render();
  }
  resize();
  camera.position.set(0, 10, 30);
  camera.lookAt(0, 0, 0);
  try {
    const warm = new THREE22.WebGLRenderTarget(64, 64);
    const flags = [];
    scene.traverse((o) => {
      flags.push([o, o.visible, o.frustumCulled]);
      o.visible = true;
      o.frustumCulled = false;
    });
    renderer.setRenderTarget(warm);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    for (const [o, v, f] of flags) {
      o.visible = v;
      o.frustumCulled = f;
    }

  } catch (e) {
  }

  if (!QA) {
    try {
      const gl = renderer.getContext();
      const px = new Uint8Array(4);
      const frame = () => {
        composer.render();
        gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
      };

      frame();
      const t0 = performance.now();
      for (let k = 0; k < 4; k++) frame();
      const ms = (performance.now() - t0) / 4;
      quality.bootMs = ms;
      if (ms < 4.6) {
        quality.budget = ms < 2.6 ? 84e5 : 42e5;
        resize();
      }
    } catch (e) {
    }
  }
  const m = /^#b(\d+)$/.exec(location.hash);
  const start = m ? clamp(parseInt(m[1], 10) - 1, 0, BEATS.length - 1) : 0;
  app.go(start, start !== 0);
  if (start === 0) {
    cs.pos.set(-14, 16, 40);
    cs.tgt.set(0, 2, 0);
    camTo(BEATS[0], false);
    cs.tw.dur = 3.2;
    cs.tw.arc = 0;
  }
  const wheel = { last: 0, acc: 0, used: false };
  window.addEventListener(
    "wheel",
    (e) => {
      e.preventDefault();
      const now = performance.now();
      if (now - wheel.last > 240) {
        wheel.acc = 0;
        wheel.used = false;
      }
      wheel.last = now;
      if (wheel.used) return;

      else if (e.deltaMode === 2) d *= 400;

  );

    if (e.metaKey || e.ctrlKey || e.altKey) return;

    } else if (k === "ArrowLeft" || k === "ArrowUp" || k === "PageUp" || k === "Backspace") {
      e.preventDefault();

    } else if (k === "Home") app.go(0);
    else if (k === "End") app.go(BEATS.length - 1);

  });
  const stage = document.getElementById("stage");
  stage.addEventListener("click", (e) => {
    if (e.target.closest("button, a, .cmpwrap")) return;

  });

  stage.addEventListener(
    "touchstart",
    (e) => {

    if (e.pointerType !== "mouse") return;

    const mm = /^#b(\d+)$/.exec(location.hash);

  let frames = 0;
  let acc = 0;
  let grace = 30;
  let firstFrame = true;
  function loop(now) {
    requestAnimationFrame(loop);
    const raw = (now - last) / 1e3;
    const dt = Math.min(0.05, raw);
    last = now;
    step(dt);
    render();
    if (firstFrame) {
      firstFrame = false;
      document.getElementById("loading").classList.add("gone");
    }
    if (grace > 0) grace--;
    else if (raw < 0.25) {
      frames++;
      acc += raw;
      if (frames >= 50) {
        if (acc / frames > 0.0215) {

          grace = 30;
        }
        frames = 0;
        acc = 0;
      }
    }
  }
  if (QA) {
    document.getElementById("loading").classList.add("gone");
    window.__qa = {
      n: BEATS.length,
      shot(i, settle = 4) {
        app.go(i, true);
        const steps = Math.round(settle * 30);
        for (let s = 0; s < steps; s++) step(1 / 30);
        render();
        return true;
      },
      size() {
        resize();
      },
      go(i) {
        app.go(i);
      },
      adv(sec) {
        const steps = Math.round(sec * 30);
        for (let s = 0; s < steps; s++) step(1 / 30);
        render();
      },
      // frame cost of beat i at a given canvas pixel ratio: [ms of simulation, ms of rendering] per frame.
      // from >= 0 measures the transition from that beat instead of the settled page.
      bench(i, { ratio: r = 1, frames: n = 30, msaa = 4, bloom: bl = true, from = -1 } = {}) {
        quality.qaRatio = r;
        if (msaa !== quality.msaa) setMsaa(msaa);
        bloom.enabled = bl;
        resize();
        const gl = renderer.getContext();
        const px = new Uint8Array(4);
        const sync = () => gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
        if (from >= 0) {
          app.go(from, true);
          for (let s = 0; s < 90; s++) step(1 / 30);
          app.go(i);
        } else {
          app.go(i, true);
          for (let s = 0; s < 90; s++) step(1 / 30);
        }
        render();
        sync();
        let a = 0;
        let b = 0;
        for (let s = 0; s < n; s++) {
          const t0 = performance.now();
          step(1 / 60);
          const t1 = performance.now();
          render();
          sync();
          a += t1 - t0;
          b += performance.now() - t1;
        }
        return [a / n, b / n];
      }
    };
  } else requestAnimationFrame(loop);
}
boot();

</script>
